version: '3.8'

services:
  # PostgreSQL para investigadores-service
  investigadores-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investigadores
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - investigadores_data:/var/lib/postgresql/data

  # MongoDB para publicaciones-service
  publicaciones-mongo:
    image: mongo:7-alpine
    environment:
      MONGO_INITDB_DATABASE: publicaciones
    ports:
      - "27017:27017"
    volumes:
      - publicaciones_data:/data/db

  # RabbitMQ para eventos
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Redis para caché
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Elasticsearch (opcional, para búsqueda)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
  #   environment:
  #     - discovery.type=single-node
  #   ports:
  #     - "9200:9200"

volumes:
  investigadores_data:
  publicaciones_data:
  rabbitmq_data:
  redis_data:
